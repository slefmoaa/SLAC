name: Update Bill Status

on:
  schedule:
    # Runs daily at 12:00 UTC (8am ET)
    - cron: '0 12 * * *'
  workflow_dispatch: {}  # allows manual run from the Actions tab
  push:
    paths:
      - 'tracked-bills.json'  # re-run automatically when the bill list changes

permissions:
  contents: write
  pages: write
  id-token: write

# Prevent overlapping Pages deployments from piling up
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-bills:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Fetch bill status from LegiScan
        env:
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
        run: node scripts/fetch-bill-status.mjs

      - name: Commit updated bills.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bills.json
          git diff --staged --quiet || git commit -m "Update bill status (automated)"
          git pull --rebase origin main
          git push

      # --- Publish the refreshed bills.json to GitHub Pages ---
      # Pages source is set to "GitHub Actions," which means nothing gets
      # published until a workflow explicitly builds + deploys it. The
      # steps above only commit to `main` — they were never wired up to
      # trigger a Pages deployment, which is why the live site was stuck
      # on old data even though bills.json on `main` was current.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
